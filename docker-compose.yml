services:
  lbase:
    build:
      context: .
      dockerfile: Dockerfile
    image: lbase/lbase:latest
    container_name: lbase
    restart: unless-stopped
    ports:
      # 三个端口都映射，允许占用时自动切换
      - "41729:41729"
      - "41730:41730"
      - "41731:41731"
    volumes:
      # 数据持久化：容器删了数据还在
      - lbase-data:/data
    environment:
      - TZ=Asia/Shanghai

volumes:
  lbase-data:
